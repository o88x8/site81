<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SITE-81 MAP</title>
<link href="styles.css" rel="stylesheet"/>
</head>
<body>
<header class="topbar">
<div class="brand">
        ◈ <span>SITE-81</span> MAP
    </div>
<div class="profile-card">
<div class="profile-avatar">
            88
        </div>
<div class="profile-info">
<div class="profile-name">
                SARDO
            </div>
<div class="profile-id">
                888 // OPERATOR
            </div>
</div>
<div class="profile-status"></div>
</div>
</header>
<div class="app">
<aside class="sidebar">
<div class="sidebar-title">
            MAP SECTIONS
        </div>
<div class="zone-list" id="zoneList"></div>
</aside>
<main class="main">
<div class="toolbar">


<span id="saveStatus" role="status" style="font-size:11px;white-space:nowrap;color:#70dcff">Loading…</span>
<div class="toolbar-spacer"></div>
<input class="search-box" id="searchInput" placeholder="Search markers..." type="text"/>
<select class="filter-select" id="filterSelect">
<option value="all">All</option>
<option value="scp">SCPs</option>
<option value="grabbable-scp">
                    Grabbable SCPs
                </option>
<option value="keycard">
                    Keycards
                </option>
<option value="item">
                    Items
                </option>
<option value="medical">
                    Medical
                </option>
<option value="door">
                    Doors
                </option>
<option value="other">
                    Other
                </option>
</select>

</div>
<div class="map-container" id="mapContainer">
<div class="map-content" id="mapContent">
<img alt="" class="map-image" draggable="false" id="mapImage"/>
<div id="markerLayer"></div>
</div>
<div class="empty-map" id="emptyMap">
<div class="empty-icon">
                    ⌁
                </div>
<div class="empty-title">
                    NO MAP LOADED
                </div>
<div class="empty-sub">No map image available for this section</div>
</div>

<div class="info-panel" id="infoPanel">
<div class="info-header">
<div class="info-icon" id="infoIcon">
                        📍
                    </div>
<div>
<div class="info-title" id="infoTitle">
                            Marker
                        </div>
<div class="info-type" id="infoType">
                            OTHER
                        </div>
</div>
</div>
<div class="info-notes" id="infoNotes"></div>
<div class="info-actions">


<button class="tool-btn" id="infoCloseBtn">
                        Close
                    </button>
</div>
</div>
<div class="zoom-controls">
<button class="zoom-btn" id="zoomOut">
                    −
                </button>
<div class="zoom-value" id="zoomValue">
                    100%
                </div>
<button class="zoom-btn" id="zoomIn">
                    +
                </button>
<button class="zoom-btn" id="zoomReset">
                    ↺
                </button>
</div>
</div>
</main>
</div>
<div class="marker-tooltip" id="markerTooltip">
<div class="tooltip-name" id="tooltipName"></div>
<div class="tooltip-type" id="tooltipType"></div>
<div class="tooltip-notes" id="tooltipNotes"></div>
</div>
<!-- =========================
     MARKER MODAL
========================= -->

<script src="app.js"></script>
</body>
</html>
